# Sanitized example only. Review for your Motion version and hardware.
# Do not place real credentials in this file or commit your live motion.conf.

daemon off
video_device /dev/video0
width 1920
height 1080
framerate 15

target_dir /var/lib/motion
picture_output off
movie_output off

stream_port 8081
stream_localhost off
webcontrol_localhost on

# Configure credentials locally on the device; never publish real values.
# stream_auth_method 2
# stream_authentication <CAMERA_USERNAME>:<CAMERA_PASSWORD>

# Observed initial motion/recording baseline:
threshold 1500
minimum_motion_frames 1
event_gap 60
pre_capture 3
post_capture 0
movie_max_time 60
movie_quality 45
movie_codec mkv
movie_filename
